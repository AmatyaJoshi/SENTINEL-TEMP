<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Sentinel - Autonomous Codebase Auditor</title>
    <meta name="description" content="Autonomous codebase auditing dashboard for hunting vulnerabilities, verifying exploits, ranking findings, and generating regression fixes." />
    <meta property="og:title" content="Sentinel - Autonomous Codebase Auditor" />
    <meta property="og:description" content="Autonomous codebase auditing dashboard for hunting vulnerabilities, verifying exploits, ranking findings, and generating regression fixes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sentinel.theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
